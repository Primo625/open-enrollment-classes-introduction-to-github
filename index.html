<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ridge Holdings — Global Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border-bottom: 1px solid #1e293b;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .logo-group {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.1rem;
        color: #fff;
      }

      .logo-text {
        font-size: 1.25rem;
        font-weight: 700;
        color: #f8fafc;
        letter-spacing: -0.02em;
      }

      .logo-text span {
        color: #60a5fa;
      }

      nav {
        display: flex;
        gap: 1.5rem;
      }

      nav a {
        color: #94a3b8;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: color 0.2s;
      }

      nav a:hover {
        color: #e2e8f0;
      }

      .hero {
        text-align: center;
        padding: 3rem 2rem 1.5rem;
        background: linear-gradient(180deg, #0f172a 0%, #1a1f3a 100%);
      }

      .hero h1 {
        font-size: 2.25rem;
        font-weight: 700;
        color: #f8fafc;
        margin-bottom: 0.75rem;
        letter-spacing: -0.03em;
      }

      .hero p {
        font-size: 1.05rem;
        color: #94a3b8;
        max-width: 560px;
        margin: 0 auto;
        line-height: 1.6;
      }

      .stats-bar {
        display: flex;
        justify-content: center;
        gap: 2.5rem;
        padding: 1.25rem 2rem;
        background: #1e293b;
        border-top: 1px solid #334155;
        border-bottom: 1px solid #334155;
        flex-wrap: wrap;
      }

      .stat {
        text-align: center;
      }

      .stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: #60a5fa;
      }

      .stat-label {
        font-size: 0.75rem;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 0.15rem;
      }

      .map-container {
        flex: 1;
        position: relative;
        min-height: 500px;
      }

      #map {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }

      footer {
        background: #0f172a;
        border-top: 1px solid #1e293b;
        padding: 1.25rem 2rem;
        text-align: center;
        font-size: 0.8rem;
        color: #475569;
      }

      footer a {
        color: #60a5fa;
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }

      .gm-style-iw-d {
        overflow: hidden !important;
      }

      .info-window {
        font-family: 'Inter', system-ui, sans-serif;
        padding: 4px 2px;
      }

      .info-window .iw-handle {
        font-weight: 600;
        font-size: 0.95rem;
        color: #1e293b;
      }

      .info-window .iw-link {
        display: inline-block;
        margin-top: 4px;
        font-size: 0.8rem;
        color: #3b82f6;
        text-decoration: none;
      }

      .info-window .iw-link:hover {
        text-decoration: underline;
      }

      @media (max-width: 640px) {
        .hero h1 {
          font-size: 1.5rem;
        }

        .hero p {
          font-size: 0.95rem;
        }

        .hero {
          padding: 2rem 1.25rem 1rem;
        }

        header {
          padding: 0.75rem 1rem;
        }

        .stats-bar {
          gap: 1.5rem;
        }

        .map-container {
          min-height: 400px;
        }
      }
    </style>
    <script>
      var map;
      var markerCount = 0;

      function initialize() {
        map = new google.maps.Map(document.getElementById('map'), {
          zoom: 2,
          center: new google.maps.LatLng(20, 0),
          mapTypeId: 'terrain',
          styles: [
            { elementType: 'geometry', stylers: [{ color: '#1a1a2e' }] },
            { elementType: 'labels.text.stroke', stylers: [{ color: '#1a1a2e' }] },
            { elementType: 'labels.text.fill', stylers: [{ color: '#8899aa' }] },
            { featureType: 'administrative', elementType: 'geometry.stroke', stylers: [{ color: '#334155' }] },
            { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0c1222' }] },
            { featureType: 'water', elementType: 'labels.text.fill', stylers: [{ color: '#4a5568' }] },
            { featureType: 'road', stylers: [{ visibility: 'off' }] },
            { featureType: 'poi', stylers: [{ visibility: 'off' }] },
            { featureType: 'transit', stylers: [{ visibility: 'off' }] },
            { featureType: 'landscape.natural', elementType: 'geometry', stylers: [{ color: '#1e293b' }] }
          ]
        });

        var script = document.createElement('script');
        script.src = 'render.js';
        document.getElementsByTagName('head')[0].appendChild(script);
      }

      window.eqfeed_callback = function(results) {
        var bounds = new google.maps.LatLngBounds();

        for (var i = 0; i < results.features.length; i++) {
          var coords = results.features[i].geometry.coordinates;
          var username = results.features[i].properties.username || 'contributor';
          var latLng = new google.maps.LatLng(coords[1], coords[0]);

          var marker = new google.maps.Marker({
            position: latLng,
            map: map,
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              fillColor: '#60a5fa',
              fillOpacity: 0.85,
              strokeColor: '#3b82f6',
              strokeWeight: 1.5,
              scale: 7
            },
            title: username
          });

          bounds.extend(latLng);
          markerCount++;

          (function(marker, username) {
            var content = '<div class="info-window">' +
              '<div class="iw-handle">@' + username + '</div>' +
              '<a class="iw-link" href="https://github.com/' + username + '" target="_blank" rel="noopener">View GitHub Profile &rarr;</a>' +
              '</div>';

            var infoWindow = new google.maps.InfoWindow({ content: content });

            marker.addListener('click', function() {
              infoWindow.open(map, marker);
            });
          })(marker, username);
        }

        var countEl = document.getElementById('contributor-count');
        if (countEl) countEl.textContent = markerCount.toLocaleString();
      }
    </script>
  </head>
  <body>
    <header>
      <div class="logo-group">
        <div class="logo-icon">RH</div>
        <div class="logo-text">Ridge<span>Holdings</span></div>
      </div>
      <nav>
        <a href="#">Community</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Our Global Community</h1>
      <p>Meet contributors from around the world who are building and learning together on GitHub.</p>
    </section>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="contributor-count">&mdash;</div>
        <div class="stat-label">Contributors</div>
      </div>
      <div class="stat">
        <div class="stat-value">30+</div>
        <div class="stat-label">Countries</div>
      </div>
      <div class="stat">
        <div class="stat-value">Open</div>
        <div class="stat-label">Source</div>
      </div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>

    <footer>
      &copy; 2026 Ridge Holdings &mdash; Powered by <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a>
    </footer>

    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB48gZNKOtEbslmLkTWtphkzCJVM6ITd1s&callback=initialize">
    </script>
  </body>
</html>
